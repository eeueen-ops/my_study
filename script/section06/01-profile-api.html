<!DOCTYPE html>
<html lang="ko">
<head>
    <title>프로필API실습</title>
    <script>
        const 프로필불러오는기능 = () =>{
            document.getElementById("프로필보여주는곳").innerHTML = "인스타 프로필 불러오는 중..."

            fetch("https://jsonplaceholder.typicode.com/users/1")
                .then((응답)=>{
                    if(응답.ok === false) throw new Error("프로필을 불러오지 못했어요.")
                    return 응답.json()
                })
                .then((프로필) => {
                    console.log(프로필)
                    document.getElementById("프로필보여주는곳").innerHTML = `
                        <h1>${프로필.name}</h1>
                        <p>${프로필.email}</p>
                        <p>${프로필.phone}</p>
                        <p>${프로필.website}</p>
                    `
                })
                .catch((에러) => {
                    console.error(에러)
                    document.getElementById("프로필보여주는곳").innerHTML = 에러.message
                })
        }
    </script>
</head>
<body>
    <button onclick="프로필불러오는기능()">프로필 불러오기</button>
    <div id="프로필보여주는곳"></div>
</body>
</html>
