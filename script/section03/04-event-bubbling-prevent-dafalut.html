<!DOCTYPE html>
<html lang="ko">
<head>
    <title>이벤트 버블링과 기본기능 막기 실습</title>
    <script>
        const 좋아요기능함수 = () => {
            event.preventDefault();
            alert("좋아요")
        }

    </script>
</head>
<body>
    <a href="https://www.google.com">
        <div class="button-box">
            <button onclick="좋아요기능함수()">좋아요</button>
        </div>
    </a>
</body>
</html>
