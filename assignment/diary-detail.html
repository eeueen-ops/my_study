<!DOCTYPE html>
<html lang="ko">
<head>
    <title>Document</title>
    <script src="./diary-detail.js"></script>
    <link href="./diary-detail.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header__title">나의 다이어리</div>
        </div>
        <div class="body">
            <div class="body__header">
                <div class="body__header__title">이것은 타이틀 입니다.</div>
                <div class="body__header__subtitle">
                    <div class="body__header__subtitle__emotion">감정</div>
                    <div class="body__header__subtitle__date">날짜</div>
                </div>
            </div>
            <div class="body__content">
                <div class="body__content__title">내용</div>
                <div class="body__content__text">내용이들어갑니다</div>
                <div class="body__content__copy">
                    <img>내용 복사
                </div>
                <div class="body__content__button">
                    <button class="btn1" id="correct">수정</button>
                    <button class="btn1" id="delete">삭제</button>
                </div>
            </div>
            <div class="body__comment">
                <div class="body__comment__title">회고</div>
                <div class="body__comment__input">
                    <input type="text" placeholder="회고를 남겨보세요." class="comment__input__text" id="commentContent">
                    <button class="comment__input__btn" onclick="comment()">입력</button>
                </div>
                <div class="body__comment__contents">
                    <div>등록된 회고가 없습니다.</div>
                </div>
            </div>

        </div>
        
            
    </div>
    <div class="footer">
        <div class="footer__content">
            <div class="footer__title">나의 다이어리</div>
            <div class="footer__name">대표</div>
            <div class="footer__copyright">Copyright © 2024. {name} Co., Ltd.</div>
      </div>
    </div>
</body>
</html>
