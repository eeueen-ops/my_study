        const currentIndex = Number(detailPages.get("index"));
        
        // 클릭한 카드의 일기를 인덱스값 이용해 불러오기
        const currentDiary = diaryList[currentIndex];

        // 댓글 div 생성 함수
        const createComment = (comment) => {
            return `
            <div class="comment__contetn__wrapper">
                <div class="comment__content">${comment.content}</div>
                <div class="comment__date">${comment.date}</div>
            </div>
            `;
        };

        const myComment = JSON.parse(localStorage.getItem("comments")) || []

        
        // 댓글 등록 시 내용 저장
        const storeComment = () => {
            // 댓글 내용과 인덱스 객체로 저장
            const today = new Date();
            const newComment = {
                diaryId: currentDiary.diaryId,
                content: document.getElementById("writeContent").value.trim(),
                date: today.getFullYear() + ". " + (today.getMonth() + 1) + ". " + today.getDate()
            }
            // 입력창 비우기
            document.getElementById("writeContent").value = null;
            
            const myComment = JSON.parse(localStorage.getItem("comments")) || []
            myComment.push(newComment);
            localStorage.setItem("comments", JSON.stringify(myComment) );
            
        }
        
        // 현재 페이지에 불러올 댓글 목록 filter
        const currentCommentList = myComment.filter((comment) => {
            return comment.diaryId === currentDiary.DiaryId;
        })
       

    </script>
