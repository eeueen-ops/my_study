<!DOCTYPE html>
<html lang="ko">
<head>
    <title>emotion diary</title>
    <link href="./main.css" rel="stylesheet">
    <script src="./main.js" defer></script>
    <script src="./main-diary.js" defer></script>
    <script src="./main-photo.js" defer></script>
</head>
<body>
    <!-- 상단영역 fixed -->
    <div class="header">
        <div class="header__content">
            <div class="header__title">나의 다이어리</div>
            <!-- 토글 -->
            <div class="header__darkmode">
                다크모드
                <input type="checkbox" class="toggle">
            </div>
        </div>
    </div>
    <div class="container">

        <!-- 중앙 영역 -->
        <div class="body">
            <img class="body__img">

            <!-- 일기보관함 / 사진보관함 탭 -->
            <div class="body__tab">
                <div class="tab" id="tabDiary" onclick="switchTab('1')">일기보관함</div>
                <div class="tab" id="tabPhoto" onclick="switchTab('2')">사진보관함</div>
            </div>

            <!-- 컴포넌트영역 -->
            <div class="body__content" id="componentArea" ></div>
        </div>

        <!-- 하단 페이지 탭 -->
        <div class="page__tab"></div>
        
        <!-- 상단 스크롤 버튼 -->
        <a href="#">
            <img class="scroll" src="./image/up_outline_light_xl.png"></img>
        </a>
    </div>

    <!-- 하단영역 -->
    <div class="footer">
        <div class="footer__content">
            <div class="footer__title">나의 다이어리</div>
            <div class="footer__name">대표</div>
            <div class="footer__copyright">Copyright © 2024. {name} Co., Ltd.</div>
        </div>
    </div>
<!-- 일기작성모달 -->
    <div class="modal__background" id="modalWrite">
        <div class="body__modal">
            <div class="writing__title">일기 쓰기</div>
            <div class="writing__select">
                <div class="writing__select__title">오늘 기분은 어땠나요?</div>
                <div class="writing__select__radio" id="myEmition">
                    <input type="radio" name="emotion" value="1"><label>행복해요</label>   
                    <input type="radio" name="emotion" value="2"> <label>슬퍼요</label>  
                    <input type="radio" name="emotion" value="3"> <label>놀랐어요</label>  
                    <input type="radio" name="emotion" value="4"> <label>화나요</label>  
                    <input type="radio" name="emotion" value="5"> <label>기타</label> 
                </div>
            </div>
            <div class="writing__content">
                <div class="writing__content__title">제목</div>
                <input type="text" id="myTitle" class="writing__content__input1" placeholder="제목을 입력해 주세요." oninput="activeSubmit()">
                <div class="writing__content__title">내용</div>
                <textarea id="myContent" class="writing__content__input2" placeholder="내용을 입력해 주세요." oninput="activeSubmit()"></textarea>
            </div>
            
            <div class="writing__button">
                <button class="writing__button__close" id="writeDiaryClose" onclick="openModal('modalClose')">닫기</button>
                <button class="writing__button__submit" id="writeDiarySubmit" disabled="true" onclick="openModal('modalSubmit')" onclick="storeDiary()">등록하기</button>
            </div>
        </div>
    </div>

<!-- 닫기 버튼 클릭 시 모달 -->
    <div class="modal__background" id="modalClose">
        <div class="body__modal__alert">
            <div class="modal__alert__title">일기 등록 취소</div>
            <div class="modal__alert_subtitle">일기 등록을 취소하시겠어요?</div>
            <div class="modal__alert__button">
                <div class="modal__alert__button__continue" onclick="closeModal('modalClose')">계속 작성</div>
                <div class="modal__alert__button__quit" onclick="closeModal('modalClose'); closeModal('modalWrite'); clearModalContent();">등록 취소</div>
            </div>
        </div>
    </div>

<!-- 등록하기 버튼 클릭 시 모달 -->
    <div class="modal__background" id="modalSubmit">
        <div class="body__modal__alert">
            <div class="modal__alert__title">일기 등록 완료</div>
            <div class="modal__alert_subtitle">등록이 완료되었습니다.</div>
            <div class="modal__alert__button__submit" onclick="closeModal('modalSubmit'); closeModal('modalWrite');">확인</div>
        </div>
    </div>

    
</body>
</html>
