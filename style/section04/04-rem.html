<!DOCTYPE html>
<html lang="ko">
<head>
    <title>rem사이즈</title>
    <style>
        html {
            font-size: 16px;
            /* 
            16px은 기본 사이즈
            16px = 1rem
            html에서 가장 윗단은 root
            rem= root em */
            font-size: 62.5%;
            /* fontsize 1rem=10px */
        }
        .상자 {
            width: 10rem;
            height: 10rem;
            background-color: coral;
        }
    </style>
</head>
<body>
    <div class="상자"></div>
    <div class="상자"></div>
    <div class="상자"></div>
</body>
</html>
