<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .calender {
            position: relative;
        }
        .calender::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: transparent;
        }
    </style>
</head>
<body>
    <input type="date" class="calender">
</body>
</html>
