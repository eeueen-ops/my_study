<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .인스타피드 {
            width: 300px;
            height: 500px;
            background-color: lightcoral;
            margin: 50px;
        }
    </style>
    <script>
        window.addEventListener('scroll', () => {
            const 스크롤퍼센트 = document.documentElement.scrollTop / (document.documentElement.scrollHeight - document.documentElement.clientHeight)
            console.log
            if (스크롤퍼센트 >= 0.7) {
                console.log("스크롤이 70% 이상 내려왔습니다. 새로운 피드를 불러옵니다.");
                document.getElementById('인스타홈화면').innerHTML += `
                    <div class="인스타피드"></div>
                `
            }
        })
    </script>
</head>
<body id="인스타홈화면">
    <div class="인스타피드"></div>
    <div class="인스타피드"></div>
    <div class="인스타피드"></div>
</body>
</html>
