<!DOCTYPE html>
<html lang="ko">
<head>
    <title>함수실습</title>
    <script>
        function 더하기() {
            const a = 1 + 2;
            console.log(a)
            return a;
        }
        더하기();
        const 함수결과 = 더하기();
        console.log ("함수가 변환한 결과값", 함수결과);

        function 더하기2 (a, b) {
            const result = a + b;
            return result;
        }
        const 함수결과2 = 더하기2(55, 45);
        console.log ("함수가 변환한 결과값", 함수결과2);
    </script>
</head>
<body>
    
</body>
</html>

<!-- 
3
함수가 변환한 결과값 3
함수가 변환한 결과값 100 -->
