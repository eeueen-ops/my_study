<!DOCTYPE html>
<html lang="ko">
<head>
    <title>스티키스크롤</title>
    <style>
        .parent {
            width: 200px;
            height: 300px;
            border: 1px solid black;
            overflow: scroll;
        }
        .child {
            width: 150px;
            height: 200px;
            margin: 10px;
            background-color: lightblue;
        }
        .sticky__header {
            position: sticky;
            top: 0px;
            height: 50px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="sticky__header">sticky header</div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>
</html>
