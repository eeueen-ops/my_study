<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모달 만들어 보기</title>
    <style>
        .모달그룹 {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
        }
        .모달배경 {
            width: 100vw;
            height: 100vh;
            background-color: lightseagreen;
            opacity: 0.9;
        }
        .모달 {
            position: absolute;
            top: calc(50% - 500px/2);
            left: calc(50% - 400px/2);

            width: 400px;
            height: 500px;
            background-color: skyblue;
        }
        .등록완료모달 {
         position: absolute;
         top: calc(50% - 200px/2);
         left: calc(50% - 300px/2);

         width: 700px;
         height: 160px;
         background-color: orangered;
        }

    </style>
    <script>
        const 모달열기 = () => {
            document.getElementById("모달그룹ID").style = "display: block";
        }

        const 모달닫기 = () => {
            document.getElementById("모달그룹ID").style = "display: none";
        }
        
    </script>
</head>
<body>
    <button onclick="모달열기()">모달열기</button>

    <div id="모달그룹ID" class="모달그룹">
        <div id="모달배경ID" class="모달배경"></div>
        <div class="모달">
            <div>
                제목: <input type="text">
            </div>
            <div>
                내용: <textarea></textarea>
            </div>
            <div>
                <button onclick="모달열기('등록모달그룹ID')">등록하기</button>
            </div>
        </div>
    </div>

    <div id="등록완료모달그룹ID" class="모달그룹">
        <div class="모달배경">

        </div>
        <div class="등록완료모달">
            <p>등록이완료되엇습니다</p>
        </div>
    </div>


</body>
</html>
